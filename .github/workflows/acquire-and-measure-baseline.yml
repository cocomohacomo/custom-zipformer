name: acquire-and-measure-japanese-baseline

on:
  workflow_dispatch:
    inputs:
      sample_limit:
        description: Number of Common Voice test clips
        required: true
        default: "100"
        type: string
  push:
    paths:
      - ".github/workflows/acquire-and-measure-baseline.yml"
      - "scripts/run_sherpa_zipformer.py"
      - "scripts/audio_chunking.py"
      - "scripts/download_mdc_dataset.py"
      - "scripts/prepare_common_voice_baseline.py"
      - "scripts/deletion_metrics.py"

permissions:
  contents: read

concurrency:
  group: japanese-asr-baseline
  cancel-in-progress: false

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      MDC_API_KEY: ${{ secrets.MOZILLA_DATA_COLLECTIVE_TOKEN }}
      MDC_DOWNLOAD_PATH: ${{ github.workspace }}/downloads/mdc
      SAMPLE_LIMIT: ${{ inputs.sample_limit || '100' }}
      COMMON_VOICE_JA_DATASET_ID: cmu5xbhnf00fmnq07z9p3aa70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate Mozilla Data Collective credentials
        env:
          MDC_API_KEY: ${{ secrets.MOZILLA_DATA_COLLECTIVE_TOKEN }}
        run: |
          if [ -z "$MDC_API_KEY" ]; then
            echo "::error::Missing repository secret MOZILLA_DATA_COLLECTIVE_TOKEN."
            exit 2
          fi
          echo "Mozilla Data Collective credential is configured (value is not displayed)."
      - name: Install dataset client and inference runtime
        run: python -m pip install --upgrade pip datacollective sherpa-onnx soundfile scipy numpy
      - name: Download Common Voice Japanese through MDC API
        run: |
          mkdir -p "$MDC_DOWNLOAD_PATH" corpus
          python scripts/download_mdc_dataset.py
      - name: Locate extracted dataset
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path("downloads/mdc")
          candidates = list(root.rglob("test.tsv"))
          if not candidates:
              raise SystemExit("MDC download succeeded but no test.tsv was found in extracted dataset.")
          corpus_root = candidates[0].parent
          clips = corpus_root / "clips"
          if not clips.is_dir():
              raise SystemExit(f"Dataset metadata found but clips directory is missing: {clips}")
          print(f"Common Voice corpus root: {corpus_root}")
          PY
      - name: Prepare deterministic sample
        run: |
          CORPUS_ROOT="$(dirname "$(find downloads/mdc -name test.tsv -print -quit)")"
          python scripts/prepare_common_voice_baseline.py "$CORPUS_ROOT" --split test --limit "$SAMPLE_LIMIT" --seed 270021 --output tests/data/common_voice_ja
      - name: Validate prepared sample
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path("tests/data/common_voice_ja")
          data = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          rows = data.get("manifest", [])
          if not rows or data.get("copied") != len(rows):
              raise SystemExit("Prepared manifest is empty or copied count is inconsistent.")
          if len(rows) > int(os.environ["SAMPLE_LIMIT"]):
              raise SystemExit("Prepared sample exceeds SAMPLE_LIMIT.")
          missing = [item["audio"] for item in rows if not (root / item["audio"]).is_file()]
          if missing:
              raise SystemExit(f"Prepared audio files are missing: {missing[:5]}")
          print(f"Prepared {len(rows)} verified clips (requested maximum: {data['requested']}).")
          PY
      - name: Download public Japanese Zipformer comparison model
        run: |
          mkdir -p downloads models/zipformer-ja
          MODEL_URL="https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-zipformer-ja-reazonspeech-2024-08-01.tar.bz2"
          curl --fail --location --retry 3 "$MODEL_URL" -o downloads/zipformer-ja.tar.bz2
          tar -xjf downloads/zipformer-ja.tar.bz2 -C models/zipformer-ja
          find models/zipformer-ja -type f \( -name 'encoder*.onnx' -o -name 'decoder*.onnx' -o -name 'joiner*.onnx' -o -name 'tokens.txt' \) -print
      - name: Validate downloaded model files
        run: |
          for pattern in 'encoder*.onnx' 'decoder*.onnx' 'joiner*.onnx' 'tokens.txt'; do
            find models/zipformer-ja -type f -name "$pattern" -print -quit | grep -q . || { echo "::error::Missing model file matching $pattern"; exit 1; }
          done
      - name: Run Japanese Zipformer inference
        run: |
          python scripts/run_sherpa_zipformer.py tests/data/common_voice_ja/manifest.json --model-dir models/zipformer-ja --threads 2 --output-tsv tests/data/common_voice_ja/transcripts.tsv
      - name: Validate inference output
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          root = Path("tests/data/common_voice_ja")
          expected = json.loads((root / "manifest.json").read_text(encoding="utf-8"))["manifest"]
          with (root / "transcripts.tsv").open(encoding="utf-8", newline="") as f:
              rows = list(csv.DictReader(f, delimiter="\t"))
          expected_ids = [item["case_id"] for item in expected]
          actual_ids = [row["case_id"] for row in rows]
          if actual_ids != expected_ids:
              raise SystemExit(f"Inference output mismatch: expected {len(expected_ids)} rows, got {len(actual_ids)}.")
          diagnostic_fields = {"audio_duration_seconds", "audio_rms", "audio_peak",
                               "near_silence_fraction", "clipping_fraction",
                               "source_sample_rate", "source_channels"}
          missing_fields = diagnostic_fields - set(rows[0].keys()) if rows else diagnostic_fields
          if missing_fields:
              raise SystemExit(f"Inference diagnostics missing TSV columns: {sorted(missing_fields)}")
          print(f"Verified inference output and signal diagnostics for all {len(rows)} clips.")
          PY
      - name: Run bounded RMS-normalized comparison inference
        run: |
          python scripts/run_sherpa_zipformer.py tests/data/common_voice_ja/manifest.json --model-dir models/zipformer-ja --threads 2 --normalize-rms-dbfs -26 --max-gain-db 12 --output-tsv tests/data/common_voice_ja/transcripts_rms_normalized.tsv
      - name: Run fixed 15-second chunked inference comparison
        run: |
          python scripts/run_sherpa_zipformer.py tests/data/common_voice_ja/manifest.json --model-dir models/zipformer-ja --threads 2 --chunk-seconds 15 --output-tsv tests/data/common_voice_ja/transcripts_chunked_15s.tsv
      - name: Run silence-aware chunked inference comparison
        run: |
          python scripts/run_sherpa_zipformer.py tests/data/common_voice_ja/manifest.json --model-dir models/zipformer-ja --threads 2 --silence-aware-chunk-seconds 15 --chunk-search-window-seconds 2 --output-tsv tests/data/common_voice_ja/transcripts_silence_aware_15s.tsv
      - name: Run 15-second chunks with 2-second overlap
        run: |
          python scripts/run_sherpa_zipformer.py tests/data/common_voice_ja/manifest.json --model-dir models/zipformer-ja --threads 2 --chunk-seconds 15 --chunk-overlap-seconds 2 --output-tsv tests/data/common_voice_ja/transcripts_overlap_2s.tsv
      - name: Calculate deletion-focused metrics
        run: |
          python scripts/deletion_metrics.py tests/data/common_voice_ja/transcripts.tsv --output-json tests/data/common_voice_ja/baseline_metrics.json > tests/data/common_voice_ja/metrics.stdout.json
          python scripts/deletion_metrics.py tests/data/common_voice_ja/transcripts_rms_normalized.tsv --output-json tests/data/common_voice_ja/normalized_metrics.json > tests/data/common_voice_ja/normalized_metrics.stdout.json
          python scripts/deletion_metrics.py tests/data/common_voice_ja/transcripts_chunked_15s.tsv --output-json tests/data/common_voice_ja/chunked_15s_metrics.json > tests/data/common_voice_ja/chunked_15s_metrics.stdout.json
          python scripts/deletion_metrics.py tests/data/common_voice_ja/transcripts_silence_aware_15s.tsv --output-json tests/data/common_voice_ja/silence_aware_15s_metrics.json > tests/data/common_voice_ja/silence_aware_15s_metrics.stdout.json
          python scripts/deletion_metrics.py tests/data/common_voice_ja/transcripts_overlap_2s.tsv --output-json tests/data/common_voice_ja/overlap_2s_metrics.json > tests/data/common_voice_ja/overlap_2s_metrics.stdout.json
      - name: Validate metrics report
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          root = Path("tests/data/common_voice_ja")
          report = json.loads((root / "baseline_metrics.json").read_text(encoding="utf-8"))
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          if report.get("case_count") != len(manifest["manifest"]):
              raise SystemExit("Metrics case_count does not match the prepared sample.")
          for section, field in (("complete_omission", "empty_hypothesis_rate"),
                                 ("near_complete_omission", "rate"),
                                 ("severe_deletion", "rate")):
              if field not in report.get(section, {}):
                  raise SystemExit(f"Required omission metric is missing: {section}.{field}")
          if "category_summary" not in report or "char" not in report.get("summary", {}):
              raise SystemExit("Character and category summaries are required.")
          with (root / "transcripts.tsv").open(encoding="utf-8", newline="") as f:
              raw_rows = list(csv.DictReader(f, delimiter="\t"))
          normalized = json.loads((root / "normalized_metrics.json").read_text(encoding="utf-8"))
          with (root / "transcripts_rms_normalized.tsv").open(encoding="utf-8", newline="") as f:
              normalized_rows = list(csv.DictReader(f, delimiter="\t"))
          if normalized.get("case_count") != len(manifest["manifest"]) or len(normalized_rows) != len(manifest["manifest"]):
              raise SystemExit("Normalized comparison does not contain exactly one result per input clip.")
          if [r["case_id"] for r in normalized_rows] != [r["case_id"] for r in raw_rows]:
              raise SystemExit("Raw and normalized inference case order differs.")
          if not normalized_rows or "applied_gain_db" not in normalized_rows[0] or "inference_audio_rms" not in normalized_rows[0]:
              raise SystemExit("Normalization diagnostics are missing.")
          chunked = json.loads((root / "chunked_15s_metrics.json").read_text(encoding="utf-8"))
          with (root / "transcripts_chunked_15s.tsv").open(encoding="utf-8", newline="") as f:
              chunked_rows = list(csv.DictReader(f, delimiter="\t"))
          if chunked.get("case_count") != len(manifest["manifest"]) or len(chunked_rows) != len(manifest["manifest"]):
              raise SystemExit("Chunked inference does not contain exactly one result per input clip.")
          if [r["case_id"] for r in chunked_rows] != [r["case_id"] for r in raw_rows]:
              raise SystemExit("Raw and chunked inference case order differs.")
          if not chunked_rows or "inference_chunks" not in chunked_rows[0]:
              raise SystemExit("Chunk-count diagnostics are missing.")
          silence = json.loads((root / "silence_aware_15s_metrics.json").read_text(encoding="utf-8"))
          with (root / "transcripts_silence_aware_15s.tsv").open(encoding="utf-8", newline="") as f:
              silence_rows = list(csv.DictReader(f, delimiter="\t"))
          if silence.get("case_count") != len(manifest["manifest"]) or len(silence_rows) != len(manifest["manifest"]):
              raise SystemExit("Silence-aware inference does not contain exactly one result per input clip.")
          if [r["case_id"] for r in silence_rows] != [r["case_id"] for r in raw_rows]:
              raise SystemExit("Raw and silence-aware inference case order differs.")
          if not silence_rows or "chunk_boundaries_seconds" not in silence_rows[0]:
              raise SystemExit("Silence-aware boundary diagnostics are missing.")
          overlap = json.loads((root / "overlap_2s_metrics.json").read_text(encoding="utf-8"))
          with (root / "transcripts_overlap_2s.tsv").open(encoding="utf-8", newline="") as f:
              overlap_rows = list(csv.DictReader(f, delimiter="\\t"))
          if overlap.get("case_count") != len(manifest["manifest"]) or len(overlap_rows) != len(manifest["manifest"]):
              raise SystemExit("Overlap inference does not contain exactly one result per input clip.")
          if [r["case_id"] for r in overlap_rows] != [r["case_id"] for r in raw_rows]:
              raise SystemExit("Raw and overlap inference case order differs.")
          if not overlap_rows or "inference_chunks" not in overlap_rows[0] or "chunk_start_offsets_seconds" not in overlap_rows[0]:
              raise SystemExit("Overlap chunk-count or chunk-start diagnostics are missing.")
          for row in overlap_rows:
              chunk_count = int(row["inference_chunks"])
              starts = [float(value) for value in row["chunk_start_offsets_seconds"].split(",") if value]
              if len(starts) != chunk_count or not starts or starts[0] != 0.0:
                  raise SystemExit(f"Invalid overlap chunk-start offsets for {row['case_id']}.")
              if any(right <= left for left, right in zip(starts, starts[1:])):
                  raise SystemExit(f"Non-increasing overlap chunk starts for {row['case_id']}.")
          print(f"Validated raw, normalized, fixed-chunk, silence-aware, and overlap metrics for {report['case_count']} clips.")
          PY
      - name: Save baseline artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: japanese-zipformer-baseline-${{ github.run_id }}
          path: |
            tests/data/common_voice_ja/manifest.json
            tests/data/common_voice_ja/transcripts.tsv
            tests/data/common_voice_ja/baseline_metrics.json
            tests/data/common_voice_ja/metrics.stdout.json
            tests/data/common_voice_ja/transcripts_rms_normalized.tsv
            tests/data/common_voice_ja/normalized_metrics.json
            tests/data/common_voice_ja/normalized_metrics.stdout.json
            tests/data/common_voice_ja/transcripts_chunked_15s.tsv
            tests/data/common_voice_ja/chunked_15s_metrics.json
            tests/data/common_voice_ja/chunked_15s_metrics.stdout.json
            tests/data/common_voice_ja/transcripts_silence_aware_15s.tsv
            tests/data/common_voice_ja/silence_aware_15s_metrics.json
            tests/data/common_voice_ja/silence_aware_15s_metrics.stdout.json
            tests/data/common_voice_ja/transcripts_overlap_2s.tsv
            tests/data/common_voice_ja/overlap_2s_metrics.json
            tests/data/common_voice_ja/overlap_2s_metrics.stdout.json
          if-no-files-found: warn
          retention-days: 30

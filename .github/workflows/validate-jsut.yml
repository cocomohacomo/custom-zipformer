name: validate-japanese-asr-with-jsut

on:
  workflow_dispatch:
    inputs:
      sample_limit:
        description: Number of JSUT utterances (maximum 500)
        required: true
        default: "100"
        type: string
      acknowledge_license:
        description: Confirm JSUT research/personal-use terms and no audio redistribution
        required: true
        default: "no"
        type: choice
        options:
          - "no"
          - "yes"

permissions:
  contents: read

concurrency:
  group: japanese-asr-jsut-validation
  cancel-in-progress: false

jobs:
  validate:
    if: ${{ inputs.acknowledge_license == 'yes' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install JSUT downloader and inference dependencies
        run: python -m pip install --upgrade pip huggingface_hub sherpa-onnx soundfile scipy numpy
      - name: Download deterministic JSUT evaluation subset
        run: |
          python scripts/download_jsut_subset.py --limit "${{ inputs.sample_limit }}" --output tests/data/jsut_ja
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("tests/data/jsut_ja")
          data = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          if data["copied"] < 1 or data["copied"] > int("${{ inputs.sample_limit }}"):
              raise SystemExit("JSUT subset size is invalid")
          for item in data["manifest"]:
              audio = root / item["audio"]
              if not audio.is_file() or audio.stat().st_size == 0:
                  raise SystemExit(f"Missing/empty audio: {item['case_id']}")
          print(f"Verified {data['copied']} JSUT audio/transcript pairs.")
          PY
      - name: Download public Japanese Zipformer model
        run: |
          mkdir -p downloads models/zipformer-ja
          curl --fail --location --retry 3 "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-zipformer-ja-reazonspeech-2024-08-01.tar.bz2" -o downloads/zipformer-ja.tar.bz2
          tar -xjf downloads/zipformer-ja.tar.bz2 -C models/zipformer-ja
          for pattern in 'encoder*.onnx' 'decoder*.onnx' 'joiner*.onnx' 'tokens.txt'; do
            find models/zipformer-ja -type f -name "$pattern" -print -quit | grep -q . || { echo "::error::Missing model file matching $pattern"; exit 1; }
          done
      - name: Run whole-utterance inference
        run: |
          python scripts/run_sherpa_zipformer.py tests/data/jsut_ja/manifest.json --model-dir models/zipformer-ja --threads 2 --output-tsv tests/data/jsut_ja/transcripts.tsv
      - name: Run fixed 15-second chunk comparison
        run: |
          python scripts/run_sherpa_zipformer.py tests/data/jsut_ja/manifest.json --model-dir models/zipformer-ja --threads 2 --chunk-seconds 15 --output-tsv tests/data/jsut_ja/transcripts_chunked_15s.tsv
      - name: Run silence-aware chunk comparison
        run: |
          python scripts/run_sherpa_zipformer.py tests/data/jsut_ja/manifest.json --model-dir models/zipformer-ja --threads 2 --silence-aware-chunk-seconds 15 --chunk-search-window-seconds 2 --output-tsv tests/data/jsut_ja/transcripts_silence_aware_15s.tsv
      - name: Run 2-second overlap comparison
        run: |
          python scripts/run_sherpa_zipformer.py tests/data/jsut_ja/manifest.json --model-dir models/zipformer-ja --threads 2 --chunk-seconds 15 --chunk-overlap-seconds 2 --output-tsv tests/data/jsut_ja/transcripts_overlap_2s.tsv
      - name: Calculate metrics
        run: |
          for mode in "" "_chunked_15s" "_silence_aware_15s" "_overlap_2s"; do
            python scripts/deletion_metrics.py "tests/data/jsut_ja/transcripts${mode}.tsv" --output-json "tests/data/jsut_ja/metrics${mode}.json" > "tests/data/jsut_ja/metrics${mode}.stdout.json"
          done
      - name: Validate paired outputs and chunk coverage diagnostics
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          root = Path("tests/data/jsut_ja")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          expected = [item["case_id"] for item in manifest["manifest"]]
          names = ["transcripts.tsv", "transcripts_chunked_15s.tsv",
                   "transcripts_silence_aware_15s.tsv", "transcripts_overlap_2s.tsv"]
          for name in names:
              with (root / name).open(encoding="utf-8", newline="") as stream:
                  rows = list(csv.DictReader(stream, delimiter="\t"))
              if [row["case_id"] for row in rows] != expected:
                  raise SystemExit(f"Case IDs/order mismatch in {name}")
              if any(not row["hypothesis"].strip() for row in rows):
                  raise SystemExit(f"Empty hypothesis found in {name}")
          overlap = list(csv.DictReader((root / names[-1]).open(encoding="utf-8", newline=""), delimiter="\t"))
          for row in overlap:
              count = int(row["inference_chunks"])
              starts = [float(x) for x in row["chunk_start_offsets_seconds"].split(",") if x]
              if len(starts) != count or not starts or starts[0] != 0.0:
                  raise SystemExit(f"Invalid overlap offsets: {row['case_id']}")
              if any(b <= a for a, b in zip(starts, starts[1:])):
                  raise SystemExit(f"Non-increasing offsets: {row['case_id']}")
          print(f"Validated {len(expected)} paired JSUT utterances across four inference modes.")
          PY
      - name: Upload metrics and transcripts only (not licensed audio)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jsut-asr-validation-${{ github.run_id }}
          path: |
            tests/data/jsut_ja/manifest.json
            tests/data/jsut_ja/transcripts*.tsv
            tests/data/jsut_ja/metrics*.json
          if-no-files-found: warn
          retention-days: 30
  license-not-acknowledged:
    if: ${{ inputs.acknowledge_license != 'yes' }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::JSUT evaluation requires explicit acknowledgement of its research/personal-use terms."
          exit 2

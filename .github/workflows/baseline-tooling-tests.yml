name: baseline-tooling-tests

on:
  push:
    paths:
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/baseline-tooling-tests.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/baseline-tooling-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run baseline tooling tests
        run: python -m unittest discover -s tests -v
